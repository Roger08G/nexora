version: 2
updates:
    - package-ecosystem: bun
      directory: /
      target-branch: main
      schedule:
          interval: weekly
          day: monday
          time: "06:00"
          timezone: Europe/Madrid
      open-pull-requests-limit: 10
      groups:
          frontend:
              patterns: ["*"]
              update-types: ["minor", "patch"]
      commit-message:
          prefix: deps

    - package-ecosystem: cargo
      directory: /src-tauri
      target-branch: main
      schedule:
          interval: weekly
          day: monday
          time: "06:15"
          timezone: Europe/Madrid
      open-pull-requests-limit: 10
      groups:
          rust:
              patterns: ["*"]
              update-types: ["minor", "patch"]
      commit-message:
          prefix: deps

    - package-ecosystem: github-actions
      directory: /
      target-branch: main
      schedule:
          interval: weekly
          day: monday
          time: "06:30"
          timezone: Europe/Madrid
      open-pull-requests-limit: 10
      groups:
          actions:
              patterns: ["*"]
      commit-message:
          prefix: ci
