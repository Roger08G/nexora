name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    checks: write
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    frontend:
        name: Frontend
        runs-on: windows-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun ci

            - name: Check formatting
              run: bun run fmt:check

            - name: Audit frontend dependencies
              run: bun run audit:frontend

            - name: Check GitHub configuration formatting
              run: bunx prettier --check ".github/**/*.yml"

            - name: Type-check application
              run: bun run typecheck

            - name: Type-check WebView suite
              run: bunx tsc -p e2e/tsconfig.json --noEmit

            - name: Build frontend
              run: bun run build

    rust:
        name: Rust
        runs-on: windows-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Install frontend dependencies
              run: bun ci

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            - name: Check Rust formatting
              run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

            - name: Lint Rust
              run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

            - name: Audit Rust dependencies
              uses: rustsec/audit-check@v2.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  working-directory: src-tauri

            - name: Run Rust tests
              run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets

            - name: Check WebView feature
              run: cargo check --manifest-path src-tauri/Cargo.toml --locked --features e2e

            - name: Build Tauri application
              run: bun run tauri build --no-bundle --ci -- --locked
