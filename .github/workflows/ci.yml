name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    frontend:
        name: Frontend (${{ matrix.os }})
        strategy:
            matrix:
                os: [windows-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.3.14"

            - name: Install dependencies
              run: bun ci

            - name: Check formatting
              run: bun run fmt:check

            - name: Audit frontend dependencies
              run: bun run audit:frontend

            - name: Check GitHub configuration formatting
              run: bunx prettier --check ".github/**/*.yml"

            - name: Type-check application
              run: bun run typecheck

            - name: Type-check test suites
              run: bun run typecheck:tests

            - name: Run frontend regression tests
              run: bun run test:unit

            - name: Verify release packaging regressions
              shell: pwsh
              run: ./scripts/release/test-packaging.ps1

            - name: Build frontend
              run: bun run build

    rust:
        name: Rust
        runs-on: windows-latest
        timeout-minutes: 90
        permissions:
            contents: read
            checks: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.3.14"

            - name: Set up Node.js for WebDriver
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"

            - name: Install frontend dependencies
              run: bun ci

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
              with:
                  toolchain: "1.98.0"
                  components: clippy, rustfmt

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: src-tauri -> target
                  cache-on-failure: true

            - name: Check Rust formatting
              run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

            - name: Lint Rust
              run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

            - name: Audit Rust dependencies
              uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  working-directory: src-tauri

            - name: Run Rust tests
              run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets

            - name: Check WebView feature
              run: cargo check --manifest-path src-tauri/Cargo.toml --locked --features e2e

            - name: Prepare verified database runtimes
              shell: pwsh
              run: |
                  $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
                  Write-Host "Elevated Windows token: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
                  ./scripts/release/fetch-runtimes.ps1 -ExportEnvironment

            - name: Exercise real databases through Tauri IPC
              run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test tauri_managed_e2e -- --ignored

            - name: Run native WebView regression suite
              run: bun run test:e2e

            - name: Build Tauri application
              run: bun run tauri build --no-bundle --ci -- --locked

            - name: Upload WebView diagnostics
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: webview-e2e-${{ github.run_attempt }}
                  path: artifacts/e2e
                  if-no-files-found: ignore
                  retention-days: 7
