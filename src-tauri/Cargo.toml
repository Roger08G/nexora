[package]
name = "nexora"
version = "0.3.0-alpha"
description = "Local-first workspace for APIs and databases"
authors = ["Roger Gómez Martínez"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
keyring = "4.1"
mongodb = "3.8"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-wdio = { version = "1.3", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tokio-postgres = "0.7"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
